  <!-- Layer 5: Orchestration Console -->
  <g transform="translate(50, 485)">
    <rect width="1000" height="65" rx="8" fill="#0f1f38" stroke="#38bdf8" stroke-width="2"/>
    <text x="35" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="17" fill="#ffffff">
      🚀 UNIFIED COMMAND DECK: CyberDeck Web Management Portal (:5443)
    </text>
    <text x="730" y="40" font-family="monospace" font-size="12" fill="#38ef7d">
      ● 30 Containers Healthy | Portainer (:9443)
    </text>
  </g>
</svg>
