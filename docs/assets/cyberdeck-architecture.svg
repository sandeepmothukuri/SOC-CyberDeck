    <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc">LAYER 4: THREAT INTELLIGENCE, CASES &amp; SOAR</text>

    <!-- Node 1 -->
    <rect x="20" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#3b0764"/>
    <text x="35" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ddd6fe">MISP Threat Intel (:7003)</text>

    <!-- Node 2 -->
    <rect x="260" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#3b0764"/>
    <text x="275" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ddd6fe">TheHive Cases (:7005)</text>

    <!-- Node 3 -->
    <rect x="500" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#3b0764"/>
    <text x="515" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ddd6fe">Cortex Analyzers (:7006)</text>

    <!-- Node 4 -->
