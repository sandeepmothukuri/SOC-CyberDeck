    <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399">LAYER 3: SIEM CORRELATION &amp; LIVE HUNTING</text>

    <!-- Node 1 -->
    <rect x="20" y="32" width="280" height="32" rx="5" fill="url(#box-grad)" stroke="#064e3b"/>
    <text x="35" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">Wazuh SIEM / Indexer (:7001)</text>

    <!-- Node 2 -->
    <rect x="320" y="32" width="260" height="32" rx="5" fill="url(#box-grad)" stroke="#064e3b"/>
    <text x="335" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">EveBox Suricata Viewer (:7015)</text>

    <!-- Node 3 -->
    <rect x="600" y="32" width="260" height="32" rx="5" fill="url(#box-grad)" stroke="#064e3b"/>
    <text x="615" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a7f3d0">Velociraptor VQL DFIR (:7000)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 550 370 L 550 390" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Layer 4: Intelligence & SOAR -->
  <g transform="translate(50, 390)">
