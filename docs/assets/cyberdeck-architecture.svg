<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%">
  <defs>
    <linearGradient id="layer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182740"/>
      <stop offset="100%" stop-color="#121e33"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="580" fill="#070b14" rx="12"/>

  <!-- Title -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff">
    SOC-CYBERDECK <tspan fill="#38bdf8">END-TO-END PIPELINE ARCHITECTURE</tspan>
  </text>
  <text x="50" y="75" font-family="sans-serif" font-size="14" fill="#94a3b8">
    Pre-configured container mesh operating under a single bridge network (cyberdeck-net)
  </text>

  <!-- Layer 1: Adversary & Testing -->
  <g transform="translate(50, 105)">
    <rect width="1000" height="75" rx="8" fill="url(#layer-grad)" stroke="#dc2626" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f87171">LAYER 1: ADVERSARY EMULATION &amp; ATTACK SURFACE</text>

    <!-- Node 1 -->
    <rect x="20" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#450a0a"/>
    <text x="35" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fecaca">MITRE Caldera C2 (:7009)</text>

    <!-- Node 2 -->
    <rect x="260" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#450a0a"/>
    <text x="275" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fecaca">ATT&amp;CK Navigator (:7013)</text>

    <!-- Node 3 -->
    <rect x="500" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#450a0a"/>
    <text x="515" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fecaca">PCAP Traffic Injector</text>

    <!-- Description -->
    <text x="740" y="52" font-family="monospace" font-size="11" fill="#94a3b8">Simulates TTPs &amp; Noise</text>
  </g>

  <!-- Arrow down -->
  <path d="M 550 180 L 550 200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Layer 2: Ingestion & Telemetry Sensors -->
  <g transform="translate(50, 200)">
    <rect width="1000" height="75" rx="8" fill="url(#layer-grad)" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">LAYER 2: SENSORS &amp; TELEMETRY HARVESTING</text>

    <!-- Node 1 -->
    <rect x="20" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#0c4a6e"/>
    <text x="35" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bae6fd">Suricata IDS (Host Sniff)</text>

    <!-- Node 2 -->
    <rect x="260" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#0c4a6e"/>
    <text x="275" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bae6fd">Arkime PCAP (:7008)</text>

    <!-- Node 3 -->
    <rect x="500" y="32" width="220" height="32" rx="5" fill="url(#box-grad)" stroke="#0c4a6e"/>
    <text x="515" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bae6fd">FleetDM / osquery (:7007)</text>

    <!-- Node 4 -->
    <rect x="740" y="32" width="230" height="32" rx="5" fill="url(#box-grad)" stroke="#0c4a6e"/>
    <text x="755" y="53" font-family="sans-serif" font-size="13" font-weight="bold" fill="#bae6fd">Wireshark Web UI (:7099)</text>
  </g>

  <!-- Arrow down -->
  <path d="M 550 275 L 550 295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

